{% extends "base.html" %}
{% block title %}Change Password - UP Bridge{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
    <div class="card">
        <h2 style="margin-bottom: 20px;">Change Password</h2>
        <form method="POST" action="{{ url_for('web.change_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
            <label for="current_password">Current Password</label>
            <input type="password" id="current_password" name="current_password" required>
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" required minlength="8">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Change Password</button>
        </form>
    </div>
</div>
{% endblock %}
