{% extends "base.html" %}
{% block title %}Register - UP Bridge{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 80px auto;">
    <div class="card">
        <h2 style="margin-bottom: 20px;">Create Account</h2>
        {% if not valid %}
            <p>This invite link is invalid, expired, or has already been used.</p>
        {% else %}
        <form method="POST" action="{{ url_for('web.register', code=code) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>
            <label for="password">Password (minimum 8 characters)</label>
            <input type="password" id="password" name="password" required minlength="8">
            <label for="password_confirm">Confirm Password</label>
            <input type="password" id="password_confirm" name="password_confirm" required minlength="8">
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Create Account</button>
        </form>
        {% endif %}
    </div>
</div>
{% endblock %}
