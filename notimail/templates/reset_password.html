{% extends "base.html" %}
{% block title %}Reset Password - UP Bridge{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 80px auto;">
    <div class="card">
        <h2 style="margin-bottom: 20px;">Reset Password</h2>
        {% if valid %}
        <form method="POST" action="{{ url_for('web.reset_password_token', token=token) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" required minlength="8">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Set New Password</button>
        </form>
        {% else %}
        <p>This reset link is invalid or has expired. Please contact your administrator for a new one.</p>
        <a href="{{ url_for('web.login') }}" class="btn btn-primary" style="margin-top: 12px;">Back to Login</a>
        {% endif %}
    </div>
</div>
{% endblock %}
