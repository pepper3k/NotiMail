services:
  up-bridge:
    image: ghcr.io/pepper3k/up-bridge:v3.0
    # To build locally instead, comment out 'image' and uncomment 'build':
    # build: .
    container_name: up-bridge
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./secrets:/app/secrets
    ports:
      - "8080:8080"   # Flask web interface
      # - "8000:8000" # Prometheus metrics (uncomment if needed)
