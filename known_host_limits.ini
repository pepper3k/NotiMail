# Known IMAP host connection limits for NotiMail.
#
# NotiMail uses this file to proactively manage concurrent IMAP connections
# per host, preventing connection failures due to provider-imposed limits.
#
# LimitType:
#   per-ip      - The server limits total connections from a single IP address.
#                  NotiMail will cap total connections to this host.
#   per-account - The server limits connections per user account.
#                  Each account has its own pool; no cross-account limit needed.
#
# MaxConcurrent:
#   Maximum number of simultaneous IMAP IDLE connections allowed.
#   For per-ip hosts, this limits total connections from NotiMail's IP.
#   For per-account hosts, this limits connections per individual account.
#
# You can add your own servers below. Changes take effect on restart.

[imap.mail.yahoo.com]
MaxConcurrent = 5
LimitType = per-ip

[imap.aol.com]
MaxConcurrent = 5
LimitType = per-ip

[imap.gmail.com]
MaxConcurrent = 15
LimitType = per-account

[imap.googlemail.com]
MaxConcurrent = 15
LimitType = per-account

[outlook.office365.com]
MaxConcurrent = 8
LimitType = per-account

[imap-mail.outlook.com]
MaxConcurrent = 8
LimitType = per-account

[imap.outlook.com]
MaxConcurrent = 8
LimitType = per-account
